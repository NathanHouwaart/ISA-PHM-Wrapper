[project]
name = "isa-phm"
version = "0.2.0"
description = "Python wrapper for ISA-PHM datasets — parse, explore, and analyse PHM metadata and measurement data"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "bokeh>=3.0,<4.0",
    "isatools>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
notebooks = [
    "jupyterlab>=4.0",
]
agent = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "openai>=1.40,<2.0",
]

[project.scripts]
isa-phm-agent-server = "isa_phm.agent_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["isa_phm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
