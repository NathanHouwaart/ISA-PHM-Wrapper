[project]
name = "isa-phm"
version = "0.2.0"
description = "Python wrapper for ISA-PHM datasets — parse, explore, and analyse PHM metadata and measurement data"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "bokeh>=3.0",
    "isatools>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["isa_phm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
